services:
  open-canvas:
    build: .
    image: open-canvas:latest
    container_name: open-canvas
    restart: unless-stopped
    ports:
      # Loopback only: Caddy terminates TLS + auth on :443 and proxies here.
      # Never publish this port on 0.0.0.0, or the app is reachable without auth.
      - "127.0.0.1:8090:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      # Absolute URL of the public entrypoint, so generated links/assets match.
      NEXT_PUBLIC_APP_URL: https://canvas.generalwu.com
    # Optional server-side defaults (gitignored): e.g. BAILIAN_API_KEY so a
    # fresh browser can upload and generate before saving in-app settings.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
